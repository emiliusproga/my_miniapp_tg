<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список дел</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 40px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    #counter { color: var(--tg-theme-hint-color, #888888); margin: 0 0 4px; font-size: 14px; }
    #status { color: var(--tg-theme-hint-color, #888888); margin: 0 0 16px; font-size: 12px; }
    .add { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      font-size: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--tg-theme-hint-color, #cccccc);
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #000000);
      outline: none;
    }
    button {
      font-size: 16px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }
    li.done span { text-decoration: line-through; opacity: 0.5; }
    li span { flex: 1; word-break: break-word; }
    li input[type="checkbox"] { width: 22px; height: 22px; }
    .del {
      padding: 4px 10px;
      font-size: 18px;
      background: transparent;
      color: var(--tg-theme-hint-color, #888888);
    }
    #clear {
      width: 100%;
      margin-top: 8px;
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      color: var(--tg-theme-link-color, #3390ec);
    }
    .empty { text-align: center; color: var(--tg-theme-hint-color, #888888); padding: 30px 0; }
  </style>
</head>
<body>
  <h1 id="title">Мои дела</h1>
  <p id="counter"></p>
  <p id="status"></p>

  <div class="add">
    <input type="text" id="input" placeholder="Новая задача..." maxlength="200">
    <button id="addBtn">+</button>
  </div>

  <ul id="list"></ul>
  <button id="clear">Удалить выполненные</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user) {
      document.getElementById("title").textContent = "Дела: " + user.first_name;
    }

    const LOCAL_KEY = "tasks_v1";
    const PREFIX = "t_";
    const hasCloud = !!(tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9"));
    let tasks = [];

    document.getElementById("status").textContent = hasCloud
      ? "☁️ Синхронизация между устройствами включена"
      : "Задачи хранятся только на этом устройстве";

    // ---------- Хранилище ----------
    function loadLocal() {
      try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; }
      catch (e) { return []; }
    }
    function saveLocal() {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(tasks)); } catch (e) {}
    }

    function cloudGetKeys() {
      return new Promise((resolve) => {
        tg.CloudStorage.getKeys((err, keys) => resolve(err ? [] : (keys || [])));
      });
    }
    function cloudGetItems(keys) {
      return new Promise((resolve) => {
        if (!keys.length) return resolve({});
        tg.CloudStorage.getItems(keys, (err, values) => resolve(err ? {} : (values || {})));
      });
    }

    function persistTask(task) {
      saveLocal();
      if (hasCloud) tg.CloudStorage.setItem(PREFIX + task.id, JSON.stringify(task));
    }
    function removeTasks(ids) {
      saveLocal();
      if (hasCloud && ids.length) {
        tg.CloudStorage.removeItems(ids.map((id) => PREFIX + id));
      }
    }

    async function loadTasks() {
      const local = loadLocal();
      if (!hasCloud) {
        tasks = local;
        return;
      }
      const keys = (await cloudGetKeys()).filter((k) => k.startsWith(PREFIX));
      const items = await cloudGetItems(keys);
      const fromCloud = [];
      Object.values(items).forEach((v) => {
        try { fromCloud.push(JSON.parse(v)); } catch (e) {}
      });

      if (fromCloud.length === 0 && local.length > 0) {
        // Первый запуск: переносим старые задачи в облако
        tasks = local;
        tasks.forEach((t) => tg.CloudStorage.setItem(PREFIX + t.id, JSON.stringify(t)));
      } else {
        tasks = fromCloud.sort((a, b) => b.id - a.id);
        saveLocal();
      }
    }

    // ---------- Интерфейс ----------
    function haptic(type) {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type || "light");
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";

      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">Задач пока нет. Добавьте первую!</div>';
      }

      tasks.forEach((task) => {
        const li = document.createElement("li");
        if (task.done) li.className = "done";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = task.done;
        cb.addEventListener("change", () => {
          task.done = cb.checked;
          persistTask(task); haptic(); render();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.addEventListener("click", () => {
          tasks = tasks.filter((t) => t.id !== task.id);
          removeTasks([task.id]); haptic("medium"); render();
        });

        li.append(cb, text, del);
        list.appendChild(li);
      });

      const left = tasks.filter((t) => !t.done).length;
      document.getElementById("counter").textContent =
        "Осталось: " + left + " из " + tasks.length;
      document.getElementById("clear").style.display =
        tasks.some((t) => t.done) ? "block" : "none";
    }

    function addTask() {
      const input = document.getElementById("input");
      const value = input.value.trim();
      if (!value) return;
      const task = { id: Date.now(), text: value, done: false };
      tasks.unshift(task);
      input.value = "";
      persistTask(task); haptic(); render();
    }

    document.getElementById("addBtn").addEventListener("click", addTask);
    document.getElementById("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });
    document.getElementById("clear").addEventListener("click", () => {
      const doneIds = tasks.filter((t) => t.done).map((t) => t.id);
      tasks = tasks.filter((t) => !t.done);
      removeTasks(doneIds); haptic("medium"); render();
    });

    // Обновляем список, когда вы возвращаетесь в приложение
    document.addEventListener("visibilitychange", async () => {
      if (!document.hidden) { await loadTasks(); render(); }
    });

    loadTasks().then(render);
  </script>
</body>
</html>
