<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список дел</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 40px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    #counter { color: var(--tg-theme-hint-color, #888888); margin: 0 0 16px; font-size: 14px; }
    .add { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      font-size: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--tg-theme-hint-color, #cccccc);
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #000000);
      outline: none;
    }
    button {
      font-size: 16px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }
    li.done span { text-decoration: line-through; opacity: 0.5; }
    li span { flex: 1; word-break: break-word; }
    li input[type="checkbox"] { width: 22px; height: 22px; }
    .del {
      padding: 4px 10px;
      font-size: 18px;
      background: transparent;
      color: var(--tg-theme-hint-color, #888888);
    }
    #clear {
      width: 100%;
      margin-top: 8px;
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      color: var(--tg-theme-link-color, #3390ec);
    }
    .empty { text-align: center; color: var(--tg-theme-hint-color, #888888); padding: 30px 0; }
  </style>
</head>
<body>
  <h1 id="title">Мои дела</h1>
  <p id="counter"></p>

  <div class="add">
    <input type="text" id="input" placeholder="Новая задача..." maxlength="200">
    <button id="addBtn">+</button>
  </div>

  <ul id="list"></ul>
  <button id="clear">Удалить выполненные</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user) {
      document.getElementById("title").textContent = "Дела: " + user.first_name;
    }

    const KEY = "tasks_v1";
    let tasks = [];
    try {
      tasks = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch (e) {
      tasks = [];
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
    }

    function haptic(type) {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type || "light");
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";

      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">Задач пока нет. Добавьте первую!</div>';
      }

      tasks.forEach((task) => {
        const li = document.createElement("li");
        if (task.done) li.className = "done";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = task.done;
        cb.addEventListener("change", () => {
          task.done = cb.checked;
          save(); haptic(); render();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.addEventListener("click", () => {
          tasks = tasks.filter((t) => t.id !== task.id);
          save(); haptic("medium"); render();
        });

        li.append(cb, text, del);
        list.appendChild(li);
      });

      const left = tasks.filter((t) => !t.done).length;
      document.getElementById("counter").textContent =
        "Осталось: " + left + " из " + tasks.length;
      document.getElementById("clear").style.display =
        tasks.some((t) => t.done) ? "block" : "none";
    }

    function addTask() {
      const input = document.getElementById("input");
      const value = input.value.trim();
      if (!value) return;
      tasks.unshift({ id: Date.now(), text: value, done: false });
      input.value = "";
      save(); haptic(); render();
    }

    document.getElementById("addBtn").addEventListener("click", addTask);
    document.getElementById("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });
    document.getElementById("clear").addEventListener("click", () => {
      tasks = tasks.filter((t) => !t.done);
      save(); haptic("medium"); render();
    });

    render();
  </script>
</body>
</html>
